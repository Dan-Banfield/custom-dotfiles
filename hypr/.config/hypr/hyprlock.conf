background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    brightness = 0.5
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <span foreground="##cec2db">Password...</span>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.8)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
