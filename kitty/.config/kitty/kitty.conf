# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window Layout & Padding
window_padding_width 12
confirm_os_window_close 0

# Core Theme Colors
background            #1a1a1c
foreground            #ffffff
cursor                #cec2db
cursor_text_color     #1a1a1c

# Text Selection Accent
selection_background  #3d4c57
selection_foreground  #ffffff

# Terminal ANSI Color Palette Remapping
# Black / Charcoal Grey
color0  #1a1a1c
color8  #49454e

# Red (Alerts/Errors)
color1  #ff5555
color9  #ff6e6e

# Green
color2  #50fa7b
color10 #69ff94

# Yellow
color3  #f1fa8c
color11 #ffffa5

# Blue (Industrial Steel Blue)
color4  #3d4c57
color12 #526675

# Magenta (Lavender Accent)
color5  #cec2db
color13 #decbe6

# Cyan
color6  #8be9fd
color14 #a4ffff

# White / Off-White
color7  #e0e0e0
color15 #ffffff